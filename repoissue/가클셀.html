<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type=text]{
            color:red;
            border: 2px solid blue;
            border-radius: 5px;

        }
        input[type=text]:hover{ /*올려놓기만 하는거는 호버*/
            background: yellow;
            font-size: 120%;
        }
        input[type=text]:focus{ /*그거를 클릭해서 하는건 포커스*/
            font-size: 300%;
        }
    </style>
</head>
<body>
    <label>
    <input type="text" placeholder="홀더">
    </label>
    <label>
    <input type="text" placeholder="메일">
    </label>
    <label>
    <input type="text" placeholder="번호">
    </label>
</body>
</html>
