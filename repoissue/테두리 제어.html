<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid blue;
            border-collapse: collapse;
        }
        td,th{border: 1px dashed green;}
        tbody tr:nth-child(even){
            background: navy;
        }
        tbody tr:nth-child(odd){
            background: yellow;
        }

    </style>
</head>
<body>
    <h2>1학기 성적</h2>
    <hr>
    <table border="1">
        <thead>
            <tr>
                <th>이름</th>
                <th>HTML</th>
                <th>CSS</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th>황기태</th>
                <th>80</th>
                <th>70</th>
            </tr>
        </tfoot>
        <tbody>
            <tr>
                <td>이재문</td>
                <td>95</td>
                <td>99</td>
            </tr>
            <tr>
                <td>합</td>
                <td>175</td>
                <td>169</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
