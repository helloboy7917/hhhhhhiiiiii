<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes tca{
            0%{color: aqua;}
            20%{color:blue;}
            40%{color: yellow;}
            60%{color: red;}
            80%{color: green;}
            100%{color: cyan;}
            
        }
        span{
            animation-name: tca;
            animation-duration: 5s;
            animation-iteration-count: infinite ;
        }
    </style>
</head>
<body>
    <p><span>span</span>이라는 텍스트의 색변화를 무한반복 합니다.</p>
</body>
</html>
